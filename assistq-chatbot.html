<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AssistQ — Intelligent Business Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#f5f7fa;--accent:#8fe7f2;--accent-2:#b8a7ff;--bg:#080a0d;--surface:rgba(18,22,27,.96);--border:rgba(255,255,255,.10);--bubble-bot:rgba(255,255,255,.045);--bubble-user:#8fe7f2;--font-body:"Manrope",-apple-system,"Segoe UI",sans-serif;--accent-glow:rgba(143,231,242,.20);--text:#f5f7fa}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:transparent}
body{font-family:var(--font-body);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
#launcher{position:absolute;bottom:14px;right:14px;width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,var(--accent-2),var(--accent));color:#071014;display:flex;align-items:center;justify-content:center;font-size:27px;cursor:pointer;border:0;box-shadow:0 10px 28px var(--accent-glow);transition:transform .2s ease;animation:aqFloat 4s ease-in-out infinite,aqGlow 3.5s ease-in-out infinite;will-change:transform}
#launcher::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--accent);opacity:.5;animation:launcherPulse 2.6s ease-out infinite}
#launcher::after{content:"";position:absolute;inset:7px;border-radius:50%;border:1px solid rgba(255,255,255,.10);opacity:.8}
#launcher:hover{transform:scale(1.06)}
#panel{position:absolute;bottom:14px;right:14px;width:360px;max-width:calc(100vw - 20px);height:calc(100vh - 20px);max-height:640px;background:linear-gradient(180deg,rgba(17,22,27,.98),rgba(8,11,14,.99));border-radius:24px;box-shadow:0 24px 60px -10px rgba(20,33,61,.35);display:none;flex-direction:column;overflow:hidden;border:1px solid var(--border);transform-origin:bottom right}
#panel.open{display:flex;animation:aqPanelIn .48s cubic-bezier(.16,1,.3,1)}
#header{background:linear-gradient(135deg,rgba(18,26,31,.98),rgba(8,12,15,.98));color:#fff;padding:18px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:10px;flex-shrink:0}
#header::before{content:"●";color:#6adf8a;font-size:9px;filter:drop-shadow(0 0 4px #6adf8a)}
#header span{display:block;font-weight:400;font-size:12px;opacity:.65;margin-top:3px}
#closeBtn{margin-left:auto;background:none;border:0;color:var(--text);opacity:.75;font-size:18px;cursor:pointer;line-height:1;transition:transform .28s ease,opacity .28s ease}
#closeBtn:hover{opacity:1;transform:rotate(90deg)}
#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:11px}
.msg{max-width:82%;padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.45;animation:aqMsgIn .42s cubic-bezier(.16,1,.3,1);will-change:transform,opacity}
.msg.bot{background:var(--bubble-bot);color:var(--ink);align-self:flex-start;border-bottom-left-radius:4px;box-shadow:0 2px 8px rgba(20,33,61,.06)}
.msg.user{background:linear-gradient(135deg,var(--bubble-user),#1c2f57);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.msg.error{background:#fdecea;color:#a12622;align-self:flex-start;font-family:ui-monospace,monospace;font-size:12px}
#inputRow{display:flex;padding:12px;gap:9px;border-top:1px solid var(--border);background:var(--surface);flex-shrink:0}
#textInput{flex:1;border:1px solid var(--border);border-radius:20px;padding:11px 15px;font-size:14px;outline:none;font-family:var(--font-body);transition:border-color .15s ease;min-width:0;background:rgba(255,255,255,.025);color:#f5f7fa}
#textInput:focus{border-color:var(--accent)}
#textInput::placeholder{color:#66707c}
#sendBtn{background:linear-gradient(135deg,var(--accent),#d8fbff);color:#071014;border:0;border-radius:20px;padding:0 20px;font-size:14px;font-weight:700;cursor:pointer;transition:transform .28s ease,background .28s ease,box-shadow .28s ease,opacity .15s ease}
#sendBtn:disabled{opacity:.45;cursor:not-allowed}
#sendBtn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 10px 26px rgba(143,231,242,.18)}
.optionsRow{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 12px;flex-shrink:0}
.optionBtn{background:rgba(255,255,255,.035);color:var(--ink);border:1px solid rgba(143,231,242,.28);border-radius:16px;padding:8px 15px;font-size:13px;cursor:pointer;transition:transform .28s cubic-bezier(.16,1,.3,1),background .28s ease,color .28s ease,border-color .28s ease,box-shadow .28s ease}
.optionBtn:hover{background:var(--accent);color:#071014;transform:translateY(-2px) scale(1.015);box-shadow:0 8px 22px rgba(143,231,242,.08)}
#messages::-webkit-scrollbar{width:6px}
#messages::-webkit-scrollbar-thumb{background:rgba(255,255,255,.10);border-radius:99px}
@keyframes launcherPulse{0%{transform:scale(.9);opacity:.6}100%{transform:scale(1.35);opacity:0}}
@keyframes aqFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes aqGlow{0%,100%{box-shadow:0 10px 28px rgba(0,0,0,.42),0 0 0 rgba(143,231,242,0)}50%{box-shadow:0 16px 38px rgba(0,0,0,.52),0 0 28px rgba(143,231,242,.10)}}
@keyframes aqPanelIn{from{opacity:0;transform:translateY(22px) scale(.94);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes aqMsgIn{from{opacity:0;transform:translateY(9px) scale(.985)}to{opacity:1;transform:none}}
@media(max-width:480px){#panel{right:10px;bottom:10px;width:calc(100vw - 20px)}}
@media(prefers-reduced-motion:reduce){#launcher{animation:none}.msg,#panel.open{animation:none}}
</style>
</head>
<body>
<button id="launcher" type="button" aria-label="Open AssistQ assistant">💬</button>
<div id="panel" aria-label="AssistQ AI assistant">
  <div id="header">
    <div>
      <strong id="headerTitle">Chat with AssistQ</strong>
      <span id="subheader">Usually replies in a few seconds</span>
    </div>
    <button id="closeBtn" type="button" title="Close" aria-label="Close assistant">✕</button>
  </div>
  <div id="messages" aria-live="polite"></div>
  <div id="optionsContainer"></div>
  <div id="inputRow">
    <input id="textInput" type="text" placeholder="Type a message..." autocomplete="off" />
    <button id="sendBtn" type="button">Send</button>
  </div>
</div>

<script>
const params=new URLSearchParams(window.location.search);

/*
  IMPORTANT:
  No Google Apps Script webhook is hard-coded here.
  The chatbot always uses the AssistQ dashboard API unless a trusted
  embed explicitly supplies another dashboardUrl.
*/
const CONFIG={
  webhookUrl:"",
  dashboardUrl:(params.get("dashboardUrl")||"https://app.assistq.in").replace(/\/$/,""),
  clientId:params.get("clientId")||"assistq-site",
  businessName:params.get("businessName")||"AssistQ",
  greeting:"Hi! 👋 I'm the AssistQ assistant. What can we help your business improve?",
  questions:[
    {key:"name",options:null},
    {key:"businessName",options:null},
    {key:"purpose",options:["Lead capture","Lead qualification","Follow-up & automation","Sales pipeline","Analytics & reporting","Not sure yet"]},
    {key:"leadSource",options:["Website enquiries","WhatsApp","Instagram / social media","Google Ads / search","Property portals","Multiple sources"]},
    {key:"challenge",options:["Leads are being missed","Slow response / follow-up","Hard to identify high-intent leads","Leads are scattered across tools","Need better reporting","Need a complete lead workflow"]},
    {key:"teamSize",options:["Just me","2–5 people","6–15 people","16–50 people","50+ people"]},
    {key:"timeline",options:["Immediately","Within 1 month","1–3 months","Just exploring"]},
    {key:"budget",options:["Under ₹3,000/month","₹3,000–₹7,000/month","₹7,000–₹12,000/month","₹12,000+/month","Not sure yet"]}
  ]
};

if(!CONFIG.webhookUrl&&CONFIG.dashboardUrl) CONFIG.webhookUrl=CONFIG.dashboardUrl+"/api/chatbot";

const accent=params.get("accent");
const ink=params.get("ink");
if(accent)document.documentElement.style.setProperty("--accent",accent);
if(ink)document.documentElement.style.setProperty("--ink",ink);

if(!CONFIG.clientId){
  document.body.innerHTML="";
  console.warn("ASSISTQ widget: no clientId supplied.");
}

function readUTM(){
  return{
    source:(params.get("utm_source")||"").trim(),
    medium:(params.get("utm_medium")||"").trim(),
    campaign:(params.get("utm_campaign")||"").trim()
  };
}
const utm=readUTM();

let conversation=[];
let knownFields={};
let isComplete=false;
let awaitingLocalField=null;
const leadId="lead_"+Date.now()+"_"+Math.random().toString(36).slice(2,8);

const launcher=document.getElementById("launcher");
const panel=document.getElementById("panel");
const messagesEl=document.getElementById("messages");
const optionsContainer=document.getElementById("optionsContainer");
const textInput=document.getElementById("textInput");
const sendBtn=document.getElementById("sendBtn");
const closeBtn=document.getElementById("closeBtn");

function notifyParent(open){
  window.parent.postMessage({assistqWidget:true,open:!!open},"*");
}

async function loadAssistQClientConfig(){
  if(!CONFIG.dashboardUrl||!CONFIG.clientId)return;
  try{
    const r=await fetch(CONFIG.dashboardUrl+"/api/public/client-config?clientId="+encodeURIComponent(CONFIG.clientId),{cache:"no-store"});
    if(!r.ok){CONFIG.subscriptionActive=false;return;}
    const data=await r.json();
    CONFIG.subscriptionActive=data.subscription?.active!==false;
    if(!CONFIG.subscriptionActive)return;
    if(data.businessName)CONFIG.businessName=data.businessName;
    if(data.assistant?.name)document.getElementById("headerTitle").textContent="Chat with "+data.assistant.name;
    if(data.assistant?.greeting)CONFIG.greeting=data.assistant.greeting;
    if(Array.isArray(data.assistant?.questions)&&data.assistant.questions.length)CONFIG.questions=data.assistant.questions;
  }catch(e){console.debug("ASSISTQ client config unavailable",e);}
}

async function openPanel(){
  panel.classList.add("open");
  notifyParent(true);
  if(conversation.length===0){
    await loadAssistQClientConfig();
    if(CONFIG.subscriptionActive===false){
      addMessage("error","This assistant is temporarily unavailable. Please contact the AssistQ team.");
      return;
    }
    addMessage("bot",CONFIG.greeting);
    conversation.push({role:"assistant",content:CONFIG.greeting});
    bridgeEvent("assistant",CONFIG.greeting);
    showOptionsIfAny();
  }
}

function closePanel(){
  panel.classList.remove("open");
  notifyParent(false);
}

launcher.addEventListener("click",()=>panel.classList.contains("open")?closePanel():openPanel());
closeBtn.addEventListener("click",closePanel);
sendBtn.addEventListener("click",()=>sendMessage());
textInput.addEventListener("keydown",e=>{if(e.key==="Enter")sendMessage()});

function normaliseBotReply(value){
  if(value&&typeof value==="object")return String(value.reply||value.message||value.text||"Got it, thanks!");
  const text=String(value??"").trim();
  try{
    const parsed=JSON.parse(text);
    if(parsed&&typeof parsed==="object"){
      const nested=parsed.json&&typeof parsed.json==="object"?parsed.json:parsed;
      return String(nested.reply||nested.message||nested.text||text);
    }
  }catch(_){}
  return text;
}

function addMessage(sender,text){
  const div=document.createElement("div");
  div.className="msg "+sender;
  div.textContent=text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop=messagesEl.scrollHeight;
  return div;
}

function showOptionsIfAny(){
  optionsContainer.innerHTML="";
  const nextQ=CONFIG.questions.find(q=>!knownFields[q.key]);
  const opts=nextQ?.options||null;
  if(!nextQ||!opts||!opts.length)return;
  const row=document.createElement("div");
  row.className="optionsRow";
  opts.forEach(opt=>{
    const btn=document.createElement("button");
    btn.type="button";
    btn.className="optionBtn";
    btn.textContent=opt;
    btn.onclick=()=>sendMessage(opt);
    row.appendChild(btn);
  });
  optionsContainer.appendChild(row);
}

async function bridgeEvent(role,content){
  if(!CONFIG.dashboardUrl||!CONFIG.clientId)return;
  try{
    await fetch(CONFIG.dashboardUrl+"/api/bridge/conversation",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        leadId,
        event:{role,content,at:new Date().toISOString()},
        fields:knownFields,
        utm,
        clientId:CONFIG.clientId,
        businessName:CONFIG.businessName
      }),
      keepalive:true
    });
  }catch(e){console.debug("ASSISTQ dashboard bridge unavailable",e);}
}

async function bridgeLead(){
  if(!CONFIG.dashboardUrl||!CONFIG.clientId)return;
  try{
    await fetch(CONFIG.dashboardUrl+"/api/bridge/lead",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        conversationId:leadId,
        fields:knownFields,
        messages:conversation,
        utm,
        clientId:CONFIG.clientId,
        businessName:CONFIG.businessName
      }),
      keepalive:true
    });
  }catch(e){console.debug("ASSISTQ dashboard lead bridge unavailable",e);}
}

async function submitLead(){
  if(CONFIG.subscriptionActive===false){
    addMessage("error","This assistant is temporarily unavailable. Please contact the AssistQ team.");
    return;
  }
  await bridgeLead();
  try{
    const res=await fetch(CONFIG.webhookUrl,{
      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json"},
      body:JSON.stringify({
        action:"submit",
        leadId,
        fields:knownFields,
        utm,
        clientId:CONFIG.clientId,
        businessName:CONFIG.businessName
      })
    });
    const rawText=await res.text();
    let data;
    try{data=JSON.parse(rawText)}catch(_){data=null}
    if(!res.ok||!data||data.status!=="success"){
      addMessage("error","Lead submit failed: "+(data?.message||rawText.slice(0,300)||("HTTP "+res.status)));
    }else{
      addMessage("bot","✅ Saved! Thanks — we'll be in touch shortly.");
    }
  }catch(err){
    addMessage("error","Submit request failed: "+err.message);
  }
}

async function sendMessage(optionText){
  if(CONFIG.subscriptionActive===false){
    addMessage("error","This assistant is temporarily unavailable. Please contact the AssistQ team.");
    return;
  }
  const text=optionText||textInput.value.trim();
  if(!text||isComplete)return;

  if(awaitingLocalField){
    if(awaitingLocalField==="email"&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(text)){
      addMessage("error","Please enter a valid email address.");
      return;
    }
    const field=awaitingLocalField;
    knownFields[field]=text;
    addMessage("user",text);
    conversation.push({role:"user",content:text});
    bridgeEvent("user",text);
    textInput.value="";
    awaitingLocalField=null;

    const missing=["name","phone","email"].find(k=>!String(knownFields[k]||"").trim());
    if(missing){
      awaitingLocalField=missing;
      const prompt=missing==="email"
        ?"Before I save this enquiry, what is the best email address to reach you?"
        :`Before I save this enquiry, could you share your ${missing}?`;
      addMessage("bot",prompt);
      conversation.push({role:"assistant",content:prompt});
      bridgeEvent("assistant",prompt);
    }else{
      const done="Thanks! I have everything I need. Let me save your enquiry.";
      addMessage("bot",done);
      conversation.push({role:"assistant",content:done});
      bridgeEvent("assistant",done);
      isComplete=true;
      await submitLead();
    }
    return;
  }

  optionsContainer.innerHTML="";
  addMessage("user",text);
  conversation.push({role:"user",content:text});
  bridgeEvent("user",text);
  textInput.value="";
  sendBtn.disabled=true;

  const typingEl=addMessage("bot","...");

  try{
    const res=await fetch(CONFIG.webhookUrl,{
      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json"},
      body:JSON.stringify({
        action:"chat",
        leadId,
        messages:conversation,
        knownFields,
        clientId:CONFIG.clientId,
        dashboardUrl:CONFIG.dashboardUrl,
        businessName:CONFIG.businessName
      })
    });

    const rawText=await res.text();
    let data;
    try{data=JSON.parse(rawText)}catch(_){
      typingEl.remove();
      addMessage("error","Chat service returned an invalid response. Please contact the site administrator.");
      sendBtn.disabled=false;
      return;
    }

    if(!res.ok||data.status==="error"){
      typingEl.remove();
      addMessage("error","Backend error: "+(data.message||("HTTP "+res.status)));
      sendBtn.disabled=false;
      return;
    }

    typingEl.remove();
    const safeReply=normaliseBotReply(data.reply);
    addMessage("bot",safeReply);
    conversation.push({role:"assistant",content:safeReply});
    knownFields=data.fields||knownFields;
    bridgeEvent("assistant",safeReply);

    if(data.complete&&!isComplete){
      const missing=["name","phone","email"].find(k=>!String(knownFields[k]||"").trim());
      if(missing){
        awaitingLocalField=missing;
        const prompt=missing==="email"
          ?"Before I save this enquiry, what is the best email address to reach you?"
          :`Before I save this enquiry, could you share your ${missing}?`;
        addMessage("bot",prompt);
        conversation.push({role:"assistant",content:prompt});
        bridgeEvent("assistant",prompt);
      }else{
        isComplete=true;
        await submitLead();
      }
    }else{
      showOptionsIfAny();
    }
  }catch(err){
    typingEl.remove();
    addMessage("error","Request failed: "+err.message+" (check the AssistQ backend connection and your internet connection)");
  }

  sendBtn.disabled=false;
  textInput.focus();
}

(function diagnostics(){
  const warn=msg=>console.warn("ASSISTQ widget:",msg);
  if(!CONFIG.clientId)warn('No clientId supplied.');
  if(CONFIG.webhookUrl!==(CONFIG.dashboardUrl+"/api/chatbot"))warn("Unexpected webhook URL detected.");
})();
</script>
</body>
</html>
